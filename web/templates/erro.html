{% extends "base.html" %}
{% block title %}{{ titulo }} - AdoteSocrates{% endblock %}

{% block content %}
<section class="max-w-lg mx-auto bg-white p-8 sm:p-10 rounded-3xl border border-flax/60 shadow-md text-center space-y-4">
    <div class="w-14 h-14 bg-flax/50 text-moss rounded-2xl flex items-center justify-center text-2xl mx-auto">
        <i class="fa-solid fa-paw"></i>
    </div>
    <h1 class="text-2xl sm:text-3xl font-extrabold text-bistre">{{ titulo }}</h1>
    <p class="text-sm text-bistre/75">{{ msg }}</p>
    <div class="pt-2">
        <a href="{{ url_for('public.home') }}" class="bg-moss hover:bg-moss-dark text-white font-bold px-7 py-3 rounded-full shadow transition inline-block text-sm">
            Voltar ao início
        </a>
    </div>
</section>
{% endblock %}
