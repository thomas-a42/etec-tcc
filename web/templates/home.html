{% extends "base.html" %}
{% block titulo %}Início{% endblock %}

{% block conteudo %}
<section class="hero">
  <h1>Encontre seu novo melhor amigo</h1>
  <p>Animais de ONGs de todo o país esperando por um lar.</p>
  <a class="btn" href="{{ url_for('public.busca') }}">Buscar com filtros</a>
</section>

<!-- O feed.js preenche #feed com cards vindos de /api/anuncios (rolagem infinita) -->
<div id="feed" class="grid-cards" data-endpoint="{{ url_for('public.api_anuncios') }}"></div>
<p id="feed-status" class="feed-status muted" aria-live="polite"></p>
<div id="feed-sentinel"></div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/feed.js') }}"></script>
{% endblock %}
